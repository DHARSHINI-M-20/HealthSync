# Override with -Dhealthsync.mongodb.uri=... or HEALTHSYNC_MONGODB_URI.
healthsync.mongodb.uri=mongodb://localhost:27017
healthsync.mongodb.database=healthsync

# SMTP settings. Prefer HEALTHSYNC_MAIL_* environment variables for credentials.
# Example: Gmail SMTP uses smtp.gmail.com, port 587, STARTTLS true, and an app password.
healthsync.mail.host=
healthsync.mail.port=587
healthsync.mail.username=
healthsync.mail.password=
healthsync.mail.from=
healthsync.mail.starttls=true
